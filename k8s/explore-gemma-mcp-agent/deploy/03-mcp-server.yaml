apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      serviceAccountName: k8s-mcp-sa
      containers:
      - name: mcp-server
        image: gcr.io/daniellguo-anthos-dev/k8s-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp-server
  namespace: default
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: k8s-mcp-server
