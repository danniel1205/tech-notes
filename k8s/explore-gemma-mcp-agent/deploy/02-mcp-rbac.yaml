apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-role
rules:
# 1. Comprehensive Read Permissions for Cluster Diagnostics & CRD Discovery
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]

# 2. Mutating Permissions for Remediation (governed by Agent Approval Gate)
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "deployments", "statefulsets", "daemonsets", "jobs"]
  verbs: ["update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-binding
subjects:
- kind: ServiceAccount
  name: k8s-mcp-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-mcp-role
  apiGroup: rbac.authorization.k8s.io
