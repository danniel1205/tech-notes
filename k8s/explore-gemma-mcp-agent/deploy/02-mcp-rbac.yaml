apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "pods/log", "events", "deployments", "namespaces"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-binding
subjects:
- kind: ServiceAccount
  name: k8s-mcp-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-mcp-role
  apiGroup: rbac.authorization.k8s.io
