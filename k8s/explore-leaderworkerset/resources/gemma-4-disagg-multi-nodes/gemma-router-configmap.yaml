apiVersion: v1
kind: ConfigMap
metadata:
  name: gemma-router-code
  namespace: default
data:
  p2p_proxy.py: |
    import sys
    import os
    import uuid
    import aiohttp
    import asyncio
    from fastapi import FastAPI, Request
    from fastapi.responses import StreamingResponse
    import uvicorn

    sys.path.append("/vllm-workspace/examples/disaggregated/disaggregated_serving")
    import disagg_proxy_demo

    PREFILL_ZMQ = os.environ.get("PREFILL_ZMQ")
    DECODE_ZMQ = os.environ.get("DECODE_ZMQ")

    class P2PProxy(disagg_proxy_demo.Proxy):
        async def forward_request(self, url, data, request_id, use_chunked=True):
            print(f"👉 [Forward] Sending request to {url} with RequestID: {request_id}")
            async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=6*60*60)) as session:
                headers = {
                    "Authorization": f"Bearer {os.environ.get('OPENAI_API_KEY')}",
                    "X-Request-Id": request_id
                }
                try:
                    async with session.post(url=url, json=data, headers=headers) as response:
                        print(f"👈 [Forward] Got response status {response.status} from {url}")
                        if 200 <= response.status < 300 or 400 <= response.status < 500:
                            if use_chunked:
                                print(f"🌊 [Forward] Streaming response chunks from {url}...")
                                async for chunk_bytes in response.content.iter_chunked(1024):
                                    yield chunk_bytes
                            else:
                                content = await response.read()
                                yield content
                        else:
                            error_content = await response.read()
                            yield error_content
                except Exception as e:
                    yield str(e).encode('utf-8')

        async def create_chat_completion(self, raw_request: Request):
            try:
                request = await raw_request.json()
                
                # 1. Prepare prefill request. We run it synchronously with stream=False and max_tokens=1
                # to trigger prompt prefill calculation and force Nixl to generate the physical GPU block descriptors.
                kv_prepare_request = request.copy()
                kv_prepare_request["max_tokens"] = 1
                if "max_completion_tokens" in kv_prepare_request:
                    kv_prepare_request["max_completion_tokens"] = 1
                kv_prepare_request["stream"] = False  # Disable streaming so we can easily read the JSON response
                
                # Tell the prefill engine to act as a Producer and execute Nixl cache push (do_remote_decode=True)
                kv_prepare_request["kv_transfer_params"] = {
                    "do_remote_decode": True,
                    "do_remote_prefill": False
                }

                prefill_instance = self.scheduling_policy.schedule(self.prefill_cycler)
                decode_instance = self.scheduling_policy.schedule(self.decode_cycler)

                # Send prefill request and wait for JSON response
                url = f"http://{prefill_instance}/v1/chat/completions"
                print(f"👉 [Prefill] Sending request to {url}", flush=True)
                async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=6*60*60)) as session:
                    headers = {"Authorization": f"Bearer {os.environ.get('OPENAI_API_KEY')}"}
                    async with session.post(url=url, json=kv_prepare_request, headers=headers) as response:
                        if response.status != 200:
                            err_text = await response.text()
                            print(f"❌ [Prefill] Failed: {response.status} - {err_text}", flush=True)
                            return StreamingResponse(content=iter([err_text.encode('utf-8')]))
                        prefill_resp = await response.json()
                
                # Extract kv_transfer_params containing block IDs and connection metadata
                kv_params = prefill_resp.get("kv_transfer_params")
                print(f"✅ [Prefill] Completed! Received kv_transfer_params: {kv_params}", flush=True)

                # 2. Decode stage. Forward the exact KV metadata returned by prefiller to the decoder.
                # This enables the decoder to coordinate the Nixl handshake and pull blocks from prefill GPUs.
                decode_request = request.copy()
                decode_request["kv_transfer_params"] = kv_params
                
                uid = uuid.uuid4().hex
                # Ensure decode request matches the same remote request ID generated by prefiller
                request_id = kv_params.get("remote_request_id") if kv_params else f"gemma-router-req-{uid}"

                generator = self.forward_request(
                    f"http://{decode_instance}/v1/chat/completions", decode_request, request_id
                )
                return StreamingResponse(content=generator, media_type="text/event-stream")
            except Exception as e:
                print(f"❌ Error in create_chat_completion: {e}", flush=True)
                return StreamingResponse(content=iter([str(e).encode('utf-8')]))

        async def create_completion(self, raw_request: Request):
            try:
                request = await raw_request.json()
                
                # 1. Prepare prefill request. Run synchronously to execute prompt prefill and gather
                # physical Nixl GPU cache blocks returned from the prefill engine.
                kv_prepare_request = request.copy()
                kv_prepare_request["max_tokens"] = 1
                kv_prepare_request["stream"] = False  # Sync request allows reading returned json body
                
                # Instruct prefiller to act as a Producer and execute Nixl push (do_remote_decode=True)
                kv_prepare_request["kv_transfer_params"] = {
                    "do_remote_decode": True,
                    "do_remote_prefill": False
                }

                prefill_instance = self.scheduling_policy.schedule(self.prefill_cycler)
                decode_instance = self.scheduling_policy.schedule(self.decode_cycler)

                # Send prefill request
                url = f"http://{prefill_instance}/v1/completions"
                print(f"👉 [Prefill] Sending request to {url}", flush=True)
                async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=6*60*60)) as session:
                    headers = {"Authorization": f"Bearer {os.environ.get('OPENAI_API_KEY')}"}
                    async with session.post(url=url, json=kv_prepare_request, headers=headers) as response:
                        if response.status != 200:
                            err_text = await response.text()
                            print(f"❌ [Prefill] Failed: {response.status} - {err_text}", flush=True)
                            return StreamingResponse(content=iter([err_text.encode('utf-8')]))
                        prefill_resp = await response.json()
                
                # Extract kv_transfer_params containing block IDs and connection metadata
                kv_params = prefill_resp.get("kv_transfer_params")
                print(f"✅ [Prefill] Completed! Received kv_transfer_params: {kv_params}", flush=True)

                # 2. Decode stage. Forward the exact KV metadata returned by prefiller to the decoder.
                # This enables the decoder to coordinate the Nixl handshake and pull blocks from prefill GPUs.
                decode_request = request.copy()
                decode_request["kv_transfer_params"] = kv_params
                
                uid = uuid.uuid4().hex
                # Ensure decode request matches the same remote request ID generated by prefiller
                request_id = kv_params.get("remote_request_id") if kv_params else f"gemma-router-req-{uid}"

                generator = self.forward_request(
                    f"http://{decode_instance}/v1/completions", decode_request, request_id
                )
                return StreamingResponse(content=generator, media_type="text/event-stream")
            except Exception as e:
                print(f"❌ Error in create_completion: {e}", flush=True)
                return StreamingResponse(content=iter([str(e).encode('utf-8')]))

    class P2PProxyServer(disagg_proxy_demo.ProxyServer):
        def __init__(self, args):
            self.validate_parsed_serve_args(args)
            self.port = args.port
            self.proxy_instance = P2PProxy(
                prefill_instances=[] if args.prefill is None else args.prefill,
                decode_instances=[] if args.decode is None else args.decode,
                model=args.model,
                scheduling_policy=disagg_proxy_demo.RoundRobinSchedulingPolicy()
            )

        def run_server(self):
            app = FastAPI()
            app.include_router(self.proxy_instance.router)
            config = uvicorn.Config(app, host="0.0.0.0", port=self.port, loop="uvloop")
            server = uvicorn.Server(config)
            server.run()

    if __name__ == "__main__":
        args = disagg_proxy_demo.parse_args()
        proxy_server = P2PProxyServer(args=args)
        proxy_server.run_server()
