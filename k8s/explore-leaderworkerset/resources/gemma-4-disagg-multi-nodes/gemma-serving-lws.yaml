                # Patch p2p_nccl_connector.py
                fp1 = "/usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/p2p/p2p_nccl_connector.py"
                if os.path.exists(fp1):
                    with open(fp1, "r") as f: code = f.read()
                    old_load = "remote_address = ip + \":\" + str(port + self._rank)"
                    new_load = "remote_host = ip if self._rank == 0 else ip.replace(\"-0\", f\"-0-{self._rank}\")\n            remote_address = remote_host + \":\" + str(port + self._rank)"
                    if old_load in code:
                        with open(fp1, "w") as f: f.write(code.replace(old_load, new_load))
                # Patch p2p_nccl_engine.py
                fp2 = "/usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/p2p/p2p_nccl_engine.py"
                if os.path.exists(fp2):
                    with open(fp2, "r") as f: code = f.read()
                    old_init = "self.nccl_num_channels = self.config.get_from_extra_config(\n            \"nccl_num_channels\", \"8\"\n        )"
                    new_init = old_init + "\n        self.creator_pid = os.getpid()"
                    old_send = "    def send(self, comm, tensor: torch.Tensor, dst: int, stream=None):\n        assert tensor.device == self.device"
                    new_send = "    def send(self, comm, tensor: torch.Tensor, dst: int, stream=None):\n        if os.getpid() != self.creator_pid:\n            is_stale_send = (stream is self.send_stream)\n            with torch.accelerator.device_index(self.device.index):\n                self.send_stream = torch.cuda.Stream()\n                self.recv_stream = torch.cuda.Stream()\n            self.creator_pid = os.getpid()\n            if is_stale_send:\n                stream = self.send_stream\n        assert tensor.device == self.device"
                    old_recv = "    def recv(self, comm, tensor: torch.Tensor, src: int, stream=None):\n        assert tensor.device == self.device"
                    new_recv = "    def recv(self, comm, tensor: torch.Tensor, src: int, stream=None):\n        if os.getpid() != self.creator_pid:\n            is_stale_recv = (stream is self.recv_stream)\n            with torch.accelerator.device_index(self.device.index):\n                self.send_stream = torch.cuda.Stream()\n                self.recv_stream = torch.cuda.Stream()\n            self.creator_pid = os.getpid()\n            if is_stale_recv:\n                stream = self.recv_stream\n        assert tensor.device == self.device"
                    if new_init not in code:
                        with open(fp2, "w") as f: f.write(code.replace(old_init, new_init).replace(old_send, new_send).replace(old_recv, new_recv))
                # Patch parallel_state.py to allow disabling MQ broadcaster in multi-node served groups
                fp3 = "/usr/local/lib/python3.12/dist-packages/vllm/distributed/parallel_state.py"
                if os.path.exists(fp3):
                    with open(fp3, "r") as f: code = f.read()
                    target3 = "use_message_queue_broadcaster=True,"
                    replacement3 = "use_message_queue_broadcaster=(os.environ.get(\"VLLM_USE_MQ_BROADCASTER\", \"true\").lower() == \"true\"),"
                    if "import os" not in code:
                        code = "import os\n" + code
                    code = code.replace(target3, replacement3)
                    with open(fp3, "w") as f: f.write(code)
                # Patch pynccl.py to trace PyNcclCommunicator init
                fp4 = "/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/pynccl.py"
                if os.path.exists(fp4):
                    with open(fp4, "r") as f: code = f.read()
                    old_bc = "dist.broadcast(tensor, src=ranks[0], group=group)"
                    new_bc = "print(f\"[DEBUG PyNccl] Rank {self.rank}: Before Gloo broadcast unique_id to ranks={ranks} src={ranks[0]} group={group}\", flush=True)\n            dist.broadcast(tensor, src=ranks[0], group=group)\n            print(f\"[DEBUG PyNccl] Rank {self.rank}: After Gloo broadcast unique_id!\", flush=True)"
                    old_init = "self.comm: ncclComm_t = self.nccl.ncclCommInitRank(\n                self.world_size, self.unique_id, self.rank\n            )"
                    new_init = "print(f\"[DEBUG PyNccl] Rank {self.rank}: Before ncclCommInitRank self.world_size={self.world_size} self.rank={self.rank}\", flush=True)\n            self.comm: ncclComm_t = self.nccl.ncclCommInitRank(\n                self.world_size, self.unique_id, self.rank\n            )\n            print(f\"[DEBUG PyNccl] Rank {self.rank}: After ncclCommInitRank!\", flush=True)"
                    if old_bc in code:
                        code = code.replace(old_bc, new_bc)
                    if old_init in code:
                        code = code.replace(old_init, new_init)
                    with open(fp4, "w") as f: f.write(code)

                ' &&
                exec ray start --address="$(LWS_LEADER_ADDRESS):6379" --block
            env:
              - name: VLLM_USE_MQ_BROADCASTER
                value: "false"
              - name: VLLM_USE_V1
                value: "0"
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: token
              - name: NCCL_DEBUG
                value: "TRACE"
              - name: NCCL_SOCKET_IFNAME
                value: "eth0"
              - name: NCCL_IB_DISABLE
                value: "1"
              - name: NCCL_P2P_DISABLE
                value: "1"
              - name: NCCL_NET_GDR_LEVEL
                value: "0"
            resources:
              requests:
                memory: "12Gi"
                cpu: "2"
              limits:
                memory: "12Gi"
                cpu: "2"
                nvidia.com/gpu: "1" # 1 GPU for Worker
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 15Gi
